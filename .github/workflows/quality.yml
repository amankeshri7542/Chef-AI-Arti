name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # package-lock.json currently contains pre-existing transitive drift.
        # Install from package.json so checks are not blocked before they start.
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Lint changed TypeScript
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD^"
          fi

          mapfile -t FILES < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.ts' '*.tsx')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed TypeScript files to lint."
            exit 0
          fi

          printf 'Linting %s\n' "${FILES[@]}"
          # The repository predates React's new set-state-in-effect lint rule.
          # Keep that migration separate while enforcing every other rule here.
          npx eslint "${FILES[@]}" --rule 'react-hooks/set-state-in-effect: off'

      - name: Type check
        run: npx tsc --noEmit
